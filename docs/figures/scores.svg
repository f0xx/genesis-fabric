<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300">
  <rect width="920" height="300" fill="#f7f4ee"/>
  <text x="24" y="34" font-family="Georgia, serif" font-size="20" fill="#1c1915">Equal-weight total, out of 80</text>
  <text x="24" y="56" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#3d3832">Sixteen axes, five points each. The weights are a choice. A call, a VPN, and a file copy do not share a winner.</text>
  <g font-family="ui-sans-serif, sans-serif" font-size="14" fill="#1c1915">
    <text x="24" y="96">WireGuard</text>
    <rect x="150" y="80" width="640" height="22" fill="#e4ddd2"/>
    <rect x="150" y="80" width="448" height="22" fill="#1f6f5b"/>
    <text x="800" y="96">56</text>
    <text x="24" y="132">QUIC</text>
    <rect x="150" y="116" width="640" height="22" fill="#e4ddd2"/>
    <rect x="150" y="116" width="440" height="22" fill="#1f4e79"/>
    <text x="800" y="132">55</text>
    <text x="24" y="168">KCP</text>
    <rect x="150" y="152" width="640" height="22" fill="#e4ddd2"/>
    <rect x="150" y="152" width="424" height="22" fill="#7a6230"/>
    <text x="800" y="168">53</text>
    <text x="24" y="204">Genesis</text>
    <rect x="150" y="188" width="640" height="22" fill="#e4ddd2"/>
    <rect x="150" y="188" width="416" height="22" fill="#3d5c4a"/>
    <text x="800" y="204">52</text>
    <text x="24" y="240">WebRTC</text>
    <rect x="150" y="224" width="640" height="22" fill="#e4ddd2"/>
    <rect x="150" y="224" width="368" height="22" fill="#9a5520"/>
    <text x="800" y="240">46</text>
    <text x="24" y="278" font-size="12" fill="#6b6258">Bar length is the total. The spread from 46 to 56 is six points, not a different kind of protocol.</text>
  </g>
</svg>
